[project]
name = "task01-env"
version = "0.1.0"
description = "Async concurrent URL fetcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
async-fetch = "async_fetch.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "async_fetch"
module-root = "src"
